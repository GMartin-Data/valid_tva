[project]
name = "valid-tva"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "python-stdnum>=2.2",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (imports)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line length is the formatter's job
]

[tool.ruff.lint.isort]
# Pin the classification: inference from `src` proved unstable during --fix
# (third-party vs first-party flip-flop, poisoned cache, red CI on 2026-09-08).
known-first-party = ["valid_tva"]
[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"
