# Starter kit — PostgreSQL for the VAT referential.
# Start: docker compose up -d      Stop: docker compose down (-v to purge data)
services:
  postgres:
    image: postgres:16-alpine
    container_name: meridian_tva_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meridian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridian}
      POSTGRES_DB: ${POSTGRES_DB:-tva}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meridian} -d ${POSTGRES_DB:-tva}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
