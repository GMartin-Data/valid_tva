name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Becomes a real gate as soon as the first test lands (test-first discipline).
      - run: |
          if ls tests/test_*.py >/dev/null 2>&1; then
            uv run pytest
          else
            echo "No tests yet — pytest gate armed for the first test file."
          fi
