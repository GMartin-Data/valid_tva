name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: tva
        ports:
          - "5435:5432"
        options: >-
          --health-cmd "pg_isready -U meridian -d tva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Becomes a real gate as soon as the first test lands (test-first discipline).
      - run: |
          if ls tests/test_*.py >/dev/null 2>&1; then
            uv run pytest
          else
            echo "No tests yet — pytest gate armed for the first test file."
          fi
